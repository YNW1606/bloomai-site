<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Downloading ATRION — AI Powered Trades</title>
<meta name="theme-color" content="#05060c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305060c'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='Arial,sans-serif' font-weight='700' font-size='20' fill='%23e6b450'%3EA%3C/text%3E%3C/svg%3E" type="image/svg+xml">
<style>
:root{--navy:#05060c;--gold:#e6b450;--gold2:#d9a441;--text:#e8ecf5;--muted:#9fb0cc;--line:#1e2a48}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#05060c;color:var(--text);font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#0e1730;border:1px solid var(--line);border-radius:20px;padding:48px 40px;text-align:center;max-width:420px;width:90%}
.icon{width:72px;height:72px;background:rgba(0,120,215,.15);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:36px}
h1{font-size:22px;color:#fff;margin-bottom:8px}
p{color:var(--muted);font-size:14px;margin-bottom:28px}
.bar-wrap{background:#0a1226;border-radius:999px;height:6px;overflow:hidden;margin-bottom:16px}
.bar{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:999px;width:0;animation:fill 2.4s ease-in-out forwards}
@keyframes fill{0%{width:0}60%{width:70%}100%{width:100%}}
.note{font-size:12px;color:var(--muted)}
.note a{color:var(--gold2)}
</style>
</head>
<body>
<div class="card">
  <div class="icon">⬇</div>
  <h1>Your download is starting…</h1>
  <p>ATRION AI Trading Terminal for Windows is downloading. This may take a moment.</p>
  <div class="bar-wrap"><div class="bar"></div></div>
  <p class="note">If the download doesn't start, <a id="fallback" href="#">click here</a>.</p>
</div>
<script>
var FILE = "https://github.com/YNW1606/atrion-releases/releases/download/v2.0.21/ATRION-Setup-2.0.21.exe";
var NAME = "ATRION-Setup-2.0.21.exe";
(async function(){
  try {
    var res = await fetch("https://api.github.com/repos/YNW1606/atrion-releases/releases?per_page=10");
    if(res.ok){
      var rels = await res.json();
      for(var r of rels){
        var a = (r.assets||[]).find(function(x){ return x.name.endsWith('.exe') && !x.name.endsWith('.blockmap'); });
        if(a){ FILE = a.browser_download_url; NAME = a.name; break; }
      }
    }
  } catch(e){}
  document.getElementById('fallback').href = FILE;
  document.getElementById('fallback').setAttribute('download', NAME);
  var dl = document.createElement('a');
  dl.href = FILE;
  dl.setAttribute('download', NAME);
  document.body.appendChild(dl);
  dl.click();
  document.body.removeChild(dl);
})();
</script>
</body>
</html>
